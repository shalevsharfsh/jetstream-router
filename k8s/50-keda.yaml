# KEDA: serverless semantics for the two paths that can tolerate them.
#
# This is the part of the deployment that makes "scale independently" literal
# rather than aspirational. Each ScaledObject watches ONE consumer's pending
# count on the stream and scales ONLY that Deployment. A backlog on engagement
# has no effect whatsoever on the graph worker's replica count, because they are
# reading different numbers.
#
# Why queue depth rather than CPU: CPU is a lagging, indirect proxy. These
# workers are I/O-bound (Redis round-trips), so they can be badly behind while
# barely registering CPU load. Consumer lag is the thing we actually care about
# and the thing a human would look at, so it is what we scale on. This is the
# same signal AWS Lambda uses for an SQS event source; KEDA is how you get it
# on Kubernetes.
#
# Only two of the five paths are here, deliberately:
#   - content    stays at 1 — cold starts are user-visible on a notification path
#   - retraction stays at 1 — correctness-sensitive, and low volume anyway
#   - other      stays at 1 — pure observability, never the bottleneck
# A uniform policy across all five would have been less code and worse thinking.
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: engagement-worker
  namespace: jetstream-router
spec:
  scaleTargetRef:
    name: engagement-worker
  # The high-volume path. Never idles to zero in practice because likes are
  # ~70% of the firehose, but it does need headroom for bursts.
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 10
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Scale down slowly. Aggressive scale-down on a bursty stream causes
          # thrash: drop a replica, backlog returns, add it back. The cost of
          # holding a pod for another two minutes is trivial next to that.
          stabilizationWindowSeconds: 120
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: "nats.jetstream-router.svc.cluster.local:8222"
        account: "$G"
        stream: "BSKY"
        consumer: "engagement-worker"
        # Pending messages per replica before adding another.
        lagThreshold: "500"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: graph-worker
  namespace: jetstream-router
spec:
  scaleTargetRef:
    name: graph-worker
  # This was minReplicaCount: 0 — the headline "serverless scale-to-zero" case,
  # since this is the lowest-volume path (~1% of events) and a follow-burst
  # alert arriving a few seconds late costs nothing.
  #
  # I measured it, and it was wrong. KEDA logs from that run:
  #
  #   19:47:07  set replicas 1 -> 0   (queue drained, cooldown elapsed)
  #   19:49:54  set replicas 0 -> 1   (backlog reappeared)
  #   19:51:32  set replicas 1 -> 0
  #   19:51:42  set replicas 0 -> 1
  #
  # A ~2-minute oscillation, indefinitely. The mistake was treating "low volume"
  # as "idle". On a live firehose the graph path is never idle — it is *slow*,
  # a steady ~10 events/sec. Scale-to-zero suits work that genuinely stops;
  # this work never stops, so the pod is torn down and immediately needed again.
  #
  # And it is not merely wasteful here, it is incorrect. This worker detects
  # bursts over a 60-second window. The scale-down/scale-up cycle is longer than
  # that window, so a path configured this way can be asleep for exactly the
  # interval it is supposed to be watching — the detector misses the event it
  # exists to catch.
  #
  # So: floor of 1, and keep KEDA for what it is actually good for here, which
  # is scaling *out* on backlog. Genuine scale-to-zero belongs on work that is
  # genuinely intermittent — DLQ replay, backfill, a nightly reconciliation —
  # not on a continuous stream.
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 10
  cooldownPeriod: 90
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: "nats.jetstream-router.svc.cluster.local:8222"
        account: "$G"
        stream: "BSKY"
        consumer: "graph-worker"
        lagThreshold: "100"
