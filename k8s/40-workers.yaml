# One Deployment per destination.
#
# This file is the fan-out. Four Deployments, four durable consumers, four
# independent failure domains. Nothing here is shared except the image and the
# infrastructure — no shared process, no shared queue, no shared ack window.
# Killing any one of these leaves the other three untouched, which is the
# property the whole design exists to provide.
#
# The replica counts are NOT uniform, and the differences are the interesting
# part — see the comment on each.

# --- content: notifications, latency-sensitive -----------------------------
# Pinned at 1 rather than scaled from zero. A cold start on the notification
# path is a user-visible delay; on an aggregation path it costs nothing.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-worker
  namespace: jetstream-router
  labels: { app: content-worker, component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: content-worker }
  template:
    metadata:
      labels: { app: content-worker, component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: jetstream-router:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "content" }
          envFrom:
            - configMapRef: { name: router-config }
          ports: [{ name: metrics, containerPort: 9090 }]
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

# --- engagement: highest volume, scales 1..6 under KEDA --------------------
# ~79% of routed traffic. replicas is managed by the ScaledObject in
# 50-keda.yaml; the value here is only the pre-KEDA starting point.
#
# Safe to run multiple replicas because the aggregation state lives in Redis
# and the threshold alert is claimed atomically (SET NX), so two replicas
# counting the same post cannot double-alert.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement-worker
  namespace: jetstream-router
  labels: { app: engagement-worker, component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: engagement-worker }
  template:
    metadata:
      labels: { app: engagement-worker, component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: jetstream-router:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "engagement" }
          envFrom:
            - configMapRef: { name: router-config }
          ports: [{ name: metrics, containerPort: 9090 }]
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 96Mi }
            limits: { cpu: "1", memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

# --- graph: lowest-volume real path, scales 1..4 under KEDA ----------------
# ~5.6% of routed traffic. This is the one I first set to scale to zero and then
# had to correct: on a continuous stream it oscillated 1->0->1 every ~2 minutes,
# and the scale cycle is longer than its own 60s detection window. See the note
# in 50-keda.yaml.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph-worker
  namespace: jetstream-router
  labels: { app: graph-worker, component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: graph-worker }
  template:
    metadata:
      labels: { app: graph-worker, component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: jetstream-router:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "graph" }
          envFrom:
            - configMapRef: { name: router-config }
          ports: [{ name: metrics, containerPort: 9090 }]
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

# --- retraction: deletions, correctness-sensitive --------------------------
# Pinned at 1. Not because it is busy, but because deletion handling is the
# path where dropping work is least acceptable — a missed retraction is a
# correctness and potentially a compliance problem, not a delayed alert.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retraction-worker
  namespace: jetstream-router
  labels: { app: retraction-worker, component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: retraction-worker }
  template:
    metadata:
      labels: { app: retraction-worker, component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: jetstream-router:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "retraction" }
          envFrom:
            - configMapRef: { name: router-config }
          ports: [{ name: metrics, containerPort: 9090 }]
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

# --- other: observability only ---------------------------------------------
# Consumes identity/account events and any collection we have no path for, so
# unknown types show up as a metric instead of vanishing. Cheapest possible
# insurance against silent schema drift.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other-worker
  namespace: jetstream-router
  labels: { app: other-worker, component: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: other-worker }
  template:
    metadata:
      labels: { app: other-worker, component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: jetstream-router:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: ROLE, value: "other" }
          envFrom:
            - configMapRef: { name: router-config }
          ports: [{ name: metrics, containerPort: 9090 }]
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
