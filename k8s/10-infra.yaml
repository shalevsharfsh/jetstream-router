# Infrastructure the service depends on: the broker and the state store.
#
# Both are deliberately single-replica, ephemeral, and NOT how either would be
# run in production — NATS would be a 3-node cluster with real PVCs, Redis would
# be ElastiCache or a Sentinel/Cluster setup. They are here to make the topology
# runnable on a laptop in one command, and the manifests say so out loud rather
# than looking like a production recommendation someone might copy.
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: jetstream-router
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    # KEDA reads consumer lag from the monitoring port, not the client port.
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: jetstream-router
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          # -js enables JetStream (durable streams + consumers); -m 8222 exposes
          # the monitoring endpoint KEDA scrapes for per-consumer pending counts.
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { containerPort: 4222 }
            - { containerPort: 8222 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        # emptyDir: the 15-minute replay window does not survive a pod restart.
        # Acceptable for a demo, not for production.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jetstream-router
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: jetstream-router
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Aggregation state is a rolling window that rebuilds itself in
          # seconds, and the cursor is re-checkpointed every 2s. Persistence
          # would buy us almost nothing here, so it is off deliberately.
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
