# Everything an operator might change without a rebuild.
#
# The routing table lives here on purpose: adding a collection to an existing
# path is a ConfigMap edit and a restart, not a code change. Adding a *new*
# path is not — that needs a worker, a consumer and a scaling policy, so it is
# code. That split is the honest answer to "can you add an event type without
# redeploying": partly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: jetstream-router
data:
  NATS_URL: "nats://nats:4222"
  REDIS_URL: "redis://redis:6379/0"
  STREAM_NAME: "BSKY"
  LOG_LEVEL: "INFO"

  ROUTER_COLLECTION_ROUTES: |
    {
      "app.bsky.feed.post": "content",
      "app.bsky.feed.like": "engagement",
      "app.bsky.feed.repost": "engagement",
      "app.bsky.graph.follow": "graph"
    }

  # --- tap ---------------------------------------------------------------
  JETSTREAM_URL: "wss://jetstream2.us-east.bsky.network/subscribe"
  TAP_QUEUE_MAXSIZE: "10000"
  # "shed" keeps latency bounded and loses events under overload; "block" loses
  # nothing and falls behind instead. Flip this and watch jsr_events_shed_total.
  TAP_BACKPRESSURE_POLICY: "shed"
  TAP_PUBLISH_BATCH: "200"
  TAP_CURSOR_INTERVAL_S: "2"
  TAP_CURSOR_REPLAY_S: "5"

  # --- workers -----------------------------------------------------------
  WORKER_BATCH: "100"
  WORKER_MAX_DELIVER: "5"
  WORKER_ACK_WAIT_S: "30"

  # --- content path ------------------------------------------------------
  # Deliberately common words: on a live firehose, rare keywords would mean an
  # empty demo. Tune these to make the notification path noisier or quieter.
  CONTENT_KEYWORDS: "kubernetes,security,agent,ai,bluesky"
  CONTENT_LANGUAGES: "en"

  # --- engagement path ---------------------------------------------------
  ENGAGEMENT_WINDOW_S: "60"
  ENGAGEMENT_THRESHOLD: "25"

  # --- graph path --------------------------------------------------------
  FOLLOW_WINDOW_S: "60"
  FOLLOW_THRESHOLD: "10"
