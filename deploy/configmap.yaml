# The routing table is configuration, not code.
#
# Adding an event type to an existing route is an edit here plus a restart.
# Adding a genuinely new route is not, and should not be: a new route implies a
# buffer, a pool, a drop policy and its own metrics.
#
# Routing precedence is operation-first (I3): the delete rule below is evaluated
# before any collection rule regardless of where it appears in this list, because
# a delete commit carries no record for a create-path handler to match against.
#
# The per-route numbers are deliberately NOT uniform, and the buffers are not
# guesses. A buffer is time, not space: size divided by arrival rate is how long
# that route can be completely stalled before it starts losing events.
#
# Sized for roughly 60 seconds of tolerance at twice the measured mean rate,
# from a 30-second sample of the live firehose:
#
#   route          ev/s   buffer   stalled-before-loss (at 2x)
#   engagement      223    32768    73s
#   content          39     4096    53s
#   social-graph     17     2048    60s
#   retraction       13     2048    79s
#   default          13     2048    79s
#
# Sixty seconds is long enough to ride out a GC pause, a slow downstream, or a
# dependency restarting, and short enough that nothing sitting in a buffer is
# more than a minute stale. See DESIGN.md D1 for why both bounds matter.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jetstream-router
  labels:
    app: jetstream-router
data:
  config.json: |
    {
      "jetstream": {
        "url": "wss://jetstream2.us-east.bsky.network/subscribe",
        "wantedCollections": [],
        "cursor_path": "/var/lib/jetstream-router/cursor.json",
        "replay_rewind": "5s",
        "replay_window": "10m",
        "live_threshold": "3s",
        "max_lag": "60s",
        "max_frame_bytes": 1048576,
        "idle_timeout": "30s",
        "backoff_max": "30s",
        "commit_every": "1s"
      },
      "admin": { "addr": ":8080" },
      "routing": {
        "rules": [
          { "match": { "kind": "commit", "operation": "delete" },                      "route": "retraction" },
          { "match": { "kind": "commit", "collection": "app.bsky.feed.post" },         "route": "content" },
          { "match": { "kind": "commit", "collection": "app.bsky.feed.like" },         "route": "engagement" },
          { "match": { "kind": "commit", "collection": "app.bsky.feed.repost" },       "route": "engagement" },
          { "match": { "kind": "commit", "collection": "app.bsky.graph.follow" },      "route": "social-graph" }
        ],
        "fallback": "default"
      },
      "routes": {
        "content":      { "buffer": 4096,  "workers": 4, "policy": "drop" },
        "engagement":   { "buffer": 32768, "workers": 8, "policy": "drop" },
        "social-graph": { "buffer": 2048,  "workers": 2, "policy": "drop" },
        "retraction":   { "buffer": 2048,  "workers": 2, "policy": "block", "block_timeout": "2s" },
        "default":      { "buffer": 2048,  "workers": 1, "policy": "drop" }
      },
      "keywords":  ["kubernetes", "security", "agent", "bluesky"],
      "languages": ["en"],
      "thresholds": {
        "engagement": 100,
        "engagement_window": "5m",
        "followBurst": 25,
        "followBurst_window": "5m"
      },
      "state": { "max_keys_per_shard": 20000, "dedup_window": "2m" },
      "shutdown_timeout": "25s"
    }
