# CI runs the same commands the Makefile does, deliberately.
#
# A pipeline that reimplements the local checks drifts from them, and then the
# green tick stops meaning "this is what I ran". `make lint` and `make race` are
# the contract; this file just runs them somewhere else.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Matches the `go` directive in go.mod. The metrics client's
          # dependency tree requires it; see the README.
          go-version-file: go.mod
          cache: true

      # go vet, plus a gofmt check that fails rather than silently reformatting.
      - name: Lint
        run: make lint

      # -race across every package. D3 relies on a sharded mutex rather than
      # single-goroutine ownership, so the guarantee needs verifying on every
      # commit rather than being asserted in the design document.
      - name: Test with the race detector
        run: make race

      # The image is how this is actually reviewed, and the Dockerfile lives in
      # deploy/ rather than the repo root — worth failing here if that changes.
      - name: Build the container image
        run: docker build -f deploy/Dockerfile -t jetstream-router:ci .
